services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    environment:
      QDRANT_URL: http://qdrant:6333
      ALLOWED_ORIGINS: http://localhost:8000
    depends_on: [qdrant]
volumes:
  qdrant_data:
